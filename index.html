<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN — 충남대학교 컴퓨터인공지능학부</title>
<meta name="description" content="웹과 AI를 직접 만들고 가르치는 충남대학교 컴퓨터인공지능학부 학술 동아리입니다.">

<!-- 카카오톡·메신저·SNS 링크 미리보기 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ADMIN">
<meta property="og:title" content="ADMIN — 충남대학교 컴퓨터인공지능학부">
<meta property="og:description" content="웹과 AI를 직접 만들고 가르치는 충남대학교 컴퓨터인공지능학부 학술 동아리입니다.">
<meta property="og:url" content="https://cnu-admin.com/">
<meta property="og:image" content="https://cnu-admin.com/images/og-cover.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ADMIN — 충남대학교 컴퓨터인공지능학부 학술 동아리">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://cnu-admin.com/">

<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 상단 고정 바 -->
<div class="topbar">
  <div class="wrap topbar__inner">
    <a class="topbar__mark" href="#top" data-site="name">ADMIN</a>
    <nav class="topbar__nav" aria-label="섹션 바로가기">
      <ul data-site="nav"></ul>
    </nav>
  </div>
</div>

<!-- 1. 머리말 -->
<header class="masthead" id="top">
  <div class="wrap">
    <p class="masthead__affil" data-site="affiliation"></p>
    <h1 class="masthead__name" data-site="name"></h1>
    <p class="masthead__tagline" data-site="tagline"></p>
    <a class="btn masthead__cta" data-site-cta></a>
  </div>
</header>

<main>

  <!-- 2. 소개 -->
  <section class="section section--about" id="about">
    <div class="wrap grid-split">
      <div class="col-label">
        <p class="label"><span class="label__num">01</span><span data-about="label"></span></p>
      </div>
      <div class="col-body">
        <h2 class="h2" data-about="heading"></h2>
        <div class="prose" data-about="paragraphs"></div>
        <ul class="letters" data-about="letters"></ul>
      </div>
    </div>
  </section>

  <!-- 3. 하는 일 -->
  <section class="section section--activities" id="activities">
    <div class="wrap">
      <div class="section__head">
        <p class="label"><span class="label__num">02</span><span data-activities="label"></span></p>
        <h2 class="h2" data-activities="heading"></h2>
      </div>
      <div class="activity-groups" data-activities="groups"></div>
    </div>
  </section>

  <!-- 4. 올해 기록 -->
  <section class="section section--events" id="events">
    <div class="wrap">
      <div class="section__head">
        <p class="label"><span class="label__num">03</span><span data-events="label"></span></p>
        <h2 class="h2" data-events="heading"></h2>
      </div>
      <ol class="events" data-events="list"></ol>
    </div>
  </section>

  <!-- 5. 성과 -->
  <section class="section section--awards" id="awards">
    <div class="wrap">
      <div class="section__head">
        <p class="label"><span class="label__num">04</span><span data-awards="label"></span></p>
        <h2 class="h2" data-awards="heading"></h2>
        <p class="section__note" data-awards="note"></p>
      </div>
      <ul class="awards" data-awards="list"></ul>
    </div>
  </section>

  <!-- 6. 운영진 -->
  <section class="section section--members" id="members">
    <div class="wrap">
      <div class="section__head">
        <p class="label"><span class="label__num">05</span><span data-members="label"></span></p>
        <h2 class="h2" data-members="heading"></h2>
        <p class="section__note" data-members="note"></p>
      </div>
      <div class="org">
        <ul class="org__lead" data-members="lead"></ul>
        <div class="org__depts" data-members="departments"></div>
      </div>
    </div>
  </section>

  <!-- 7. 가입 안내 -->
  <section class="section section--join" id="join">
    <div class="wrap">
      <div class="section__head">
        <p class="label"><span class="label__num">06</span><span data-join="label"></span></p>
        <h2 class="h2" data-join="heading"></h2>
        <p class="section__note" data-join="note"></p>
      </div>
      <ol class="steps" data-join="steps"></ol>
      <dl class="contact-list join__details" data-join="details"></dl>
      <a class="btn" data-join-cta></a>
    </div>
  </section>

</main>

<!-- 8. 연락처 -->
<footer class="footer" id="contact">
  <div class="wrap">
    <div class="section__head">
      <p class="label"><span class="label__num">07</span><span data-contact="label"></span></p>
      <h2 class="h2 h2--footer" data-contact="heading"></h2>
      <p class="section__note" data-contact="note"></p>
    </div>
    <div class="footer__cols">
      <dl class="contact-list" data-contact="details"></dl>
      <dl class="contact-list" data-contact="links"></dl>
    </div>
    <p class="footer__copy"><span data-contact="copyright"></span></p>
  </div>
</footer>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
